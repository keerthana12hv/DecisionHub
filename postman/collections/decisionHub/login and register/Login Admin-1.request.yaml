$kind: http-request
name: Login Admin
url: http://localhost:8080/api/auth/login
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"admin@gmail.com\",\r

    \    \"password\": \"admin123\" \r

    }"
scripts:
