$kind: http-request
url: http://localhost:8080/api/decisions/1/comments/{{commentId}}/replies
method: POST
body:
  type: json
  content: "{\r

    \    \"content\":\"I also think Goa would be great!\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      pm.globals.set(\"replyId\", response.id);"
    language: text/javascript
order: 8000
