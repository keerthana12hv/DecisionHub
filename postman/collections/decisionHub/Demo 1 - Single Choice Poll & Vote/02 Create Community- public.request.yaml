$kind: http-request
name: 02 Create Community- public
url: http://localhost:8080/api/communities
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"BIT Final Year Student\",\r

    \  \"slug\": \"bit-final-year-student\",\r

    \  \"description\": \"Community for final year students to collaborate and make decisions.\",\r

    \  \"categoryId\": 1,\r

    \  \"visibility\": \"PUBLIC\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
